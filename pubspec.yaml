name: echo_aac
description: "Echo AAC prototype for building communication messages with pictogram tiles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  cached_network_image: ^3.3.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  flutter_tts: ^4.2.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pictograms/
    - assets/pictograms/ghana/
    - assets/library/
